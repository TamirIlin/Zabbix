<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>

<header class="topbar" th:fragment="header">

                <span class="brand-title">Аналитика Zabbix</span>

            </span>
        </a>
        <nav class="topnav" aria-label="Основная навигация">
            <a th:href="@{/}" class="topnav-link">Серверы</a>
            <a th:href="@{/settings}" class="topnav-link">Настройки</a>
        </nav>
        <a class="icon-btn" th:href="@{/settings}" title="Настройки" aria-label="Настройки">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"

            </svg>

    </div>

<footer class="footer" th:fragment="footer">
    <div class="container footer-inner">
        <span>© 2026 Аналитика Zabbix · Мониторинг ИТ-инфраструктуры</span>
        <span class="footer-muted">Данные предоставлены Zabbix</span>

</footer>

</body>
</html>
